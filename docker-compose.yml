version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - PORT=8000
    volumes:
      - ./uploads:/app/uploads
      - ./.llm_cache:/app/.llm_cache

  streamlit:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install streamlit requests && streamlit run web/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api
